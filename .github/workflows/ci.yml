name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository, and a public repository's workflow token should not be
# able to. Declaring it means a future step cannot quietly inherit more than it needs.
permissions:
  contents: read

jobs:
  engine:
    name: engine (pytest)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint
        working-directory: engine
        run: python -m ruff check .
      - name: Types
        working-directory: engine
        run: python -m mypy
      - name: Test
        working-directory: engine
        run: python -m pytest tests/ -q

  app:
    name: menu-bar app (build)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Generate project
        working-directory: menubar
        run: xcodegen generate
      - name: Build
        working-directory: menubar
        run: |
          xcodebuild -project Lyrebird.xcodeproj -scheme Lyrebird \
            -configuration Debug -derivedDataPath .build build
