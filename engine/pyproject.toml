[project]
name = "lyrebird"
version = "0.1.0"
description = "Transparent MITM mock proxy for iOS-simulator development (mitmproxy engine + endpoint-override API)"
requires-python = ">=3.12"   # mitmproxy 12.2.3 requires >=3.12
license = "MIT"

# Direct dependencies live in requirements.in / requirements-dev.in. `make lock` generates
# the hashed requirements.txt / requirements-dev.txt consumed by pip and CI.
#
# Lyrebird is deliberately NOT pip-installable. Modules are flat and run by path, because
# mitmproxy's `-s addon.py` loader puts that file's *directory* on sys.path, and that is what
# lets the addon `import config` inside the mitmdump child. A package layout would break it.
#
#   python3 -m venv .venv && .venv/bin/pip install --require-hashes -r requirements-dev.txt
#   ../bin/lyrebird up
#
# So this file exists for the tool configuration below.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]     # flat layout: puts engine/ on sys.path so tests can `import config`
markers = [
    "acceptance: drives a real simulator, a real proxy and the Mac's proxy settings (needs Xcode; see CONTRIBUTING.md)",
]
# The default run is the fast one, and stays exactly what it was: `pytest tests/ -q` collects
# tests/acceptance and deselects every check in it. The acceptance run asks for them explicitly —
# `pytest -m acceptance tests/acceptance -q` — and a `-m` on the command line replaces this one.
# The marker is not left to each module to remember: tests/acceptance/conftest.py applies it to
# everything it collects, so a check added there without it cannot join the fast suite and rewire
# somebody's network.
addopts = "-m 'not acceptance'"
# mitmproxy's transitive dependencies emit deprecation warnings we cannot act on; silencing them
# keeps a real warning from our own code visible.
filterwarnings = [
    "ignore::DeprecationWarning:ldap3.*",
    "ignore::DeprecationWarning:pyasn1.*",
    "ignore::DeprecationWarning:pyparsing.*",
    "ignore::pyparsing.PyparsingDeprecationWarning:mitmproxy\\.(flowfilter|command_lexer)$",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
line-length = 120
target-version = "py312"   # matches requires-python
src = ["."]

[tool.ruff.lint]
# Deliberately small. Wider rule families found a handful of real issues once, then mostly
# generated `noqa` comments arguing with stylistic opinions — which is noise, not quality.
select = ["E", "F", "I", "B", "UP", "C4"]

[tool.ruff.lint.isort]
# `cli_doubles` is a test-suite module, not a dependency: `src` points at engine/, so without this
# it sorts in with click and pytest.
known-first-party = ["cli_doubles"]

# Ruff owns Python formatting. Use statement-level `# fmt: off` / `# fmt: on` only
# for tables whose alignment conveys meaning; ordinary code follows the formatter.

[tool.mypy]
files = ["addon.py", "api.py", "cli.py", "config.py",
         "control.py", "evidence.py", "netproxy.py", "offline.py", "rules.py",
         "scenario.py", "simulator.py", "store.py", "supervisor.py", "ui.py"]
mypy_path = "."            # flat layout: `import config` must resolve from engine/
python_version = "3.12"
disallow_untyped_defs = true
# Tests are excluded deliberately: they are validated by running, and annotating fixtures and
# parametrised cases is ceremony. All three runtime deps ship py.typed, so no stubs are needed.
