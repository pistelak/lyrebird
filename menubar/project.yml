name: Lyrebird
options:
  bundleIdPrefix: com.lyrebird
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
targets:
  Lyrebird:
    type: application
    platform: macOS
    sources:
      - Lyrebird
    info:
      path: Lyrebird/Info.plist
      properties:
        # Dock visibility is controlled at runtime by DockPresence.
        CFBundleName: Lyrebird
        CFBundleDisplayName: Lyrebird
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lyrebird.Lyrebird
        PRODUCT_NAME: Lyrebird
        # Development placeholders — the Info.plist above expands these, so a release stamps both
        # on the xcodebuild command line (see menubar/README.md) rather than editing this file.
        MARKETING_VERSION: "0.0.0"
        CURRENT_PROJECT_VERSION: "0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.lyrebird.Lyrebird.debug
    # Named explicitly so `xcodebuild -scheme Lyrebird test` runs the tests: an auto-created scheme
    # is not something a CI line should have to trust.
    scheme:
      testTargets:
        - LyrebirdTests
        - LyrebirdUITests
  LyrebirdTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - LyrebirdTests
    dependencies:
      - target: Lyrebird
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lyrebird.LyrebirdTests
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
  LyrebirdUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - LyrebirdUITests
    dependencies:
      - target: Lyrebird
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lyrebird.LyrebirdUITests
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        TEST_TARGET_NAME: Lyrebird
