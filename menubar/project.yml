name: Lyrebird
options:
  bundleIdPrefix: com.lyrebird
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
targets:
  Lyrebird:
    type: application
    platform: macOS
    sources:
      - Lyrebird
    info:
      path: Lyrebird/Info.plist
      properties:
        LSUIElement: true
        CFBundleName: Lyrebird
        CFBundleDisplayName: Lyrebird
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lyrebird.Lyrebird
        PRODUCT_NAME: Lyrebird
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
